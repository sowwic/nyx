[project]
name = "nyx"
version = "0.0.1"
description = "Python nodal execution graph"
authors = [
    {name = "sowwic",email = "47799401+sowwic@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
packages = [
    {include = "nyx"},
]
dependencies = [
    "pyside6 (>=6.10.0,<7.0.0)",
    "platformdirs (>=4.5.0,<5.0.0)",
    "ruff (>=0.14.5,<0.15.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-pyproject (>=1.2.3,<2.0.0)"
]

[tool.ruff]
src = ["src"]

show-fixes = true
line-length = 89
lint.select = [
    "E",
    "F",
    "UP",
    "D",
]
lint.ignore = [
    "D100",
    "D104",
    "D103",
]
