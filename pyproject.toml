[project]
name = "nyx"
version = "0.0.1"
description = "Python nodal execution graph"
authors = [
    {name = "sowwic",email = "47799401+sowwic@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "==3.14.3"
packages = [
    {include = "nyx", from = "src"},
]
dependencies = [
    "pyside6>=6.10.0",
    "platformdirs>=4.5.0",
    "json-config"
]

[build-system]
requires = ["uv_build>=0.10.6"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-qt>=4.5.0",
    "pytest-mock>=3.15.1",
    "ruff",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.0,<10.0.0)",
    "mkdocstrings[python] (>=1.0.0,<2.0.0)",
    "mkdocs-autorefs (>=1.4.3,<2.0.0)",
    "mkdocs-autoapi (>=0.4.1,<0.5.0)",
    "debugpy>=1.8.20",
]

[tool.ruff]
src = ["src"]
exclude = ["**/resources_rc.py"]

show-fixes = true
line-length = 89
lint.select = [
    "E",
    "F",
    "UP",
]
lint.ignore = [
    "D100",
    "D104",
    "D103",
]

[tool.ty.rules]
unresolved-attribute="ignore"
invalid-argument-type="ignore"
invalid-assignment="ignore"
invalid-return-type="ignore"
invalid-method-override="ignore"

[tool.pytest.ini_options]
addopts = "--cov=nyx"
log_cli = true
log_cli_level = "ERROR"

[tool.uv.sources]
json-config = { git = "https://github.com/sowwic/json-config", tag="v1.0.2"}
