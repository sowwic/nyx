name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "nyx.spec"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "VERSION"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write

jobs:
  build-app:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --dev

      - name: Build and archive the application
        run: uv run python scripts/build.py archive-app

      - name: Test the built app
        run: uv run python scripts/build.py test-app

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: nyx-${{ runner.os }}
          path: |
            dist/nyx-*.zip
            dist/nyx-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Release workflow creates the release from the same tag, wait for it.
          for attempt in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" archives/* --clobber
